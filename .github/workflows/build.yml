name: Build iOS app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write   # allow attaching the .ipa to a Release

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project NetScan.xcodeproj \
            -scheme NetScan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/NetScan.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found at $APP_PATH"
            exit 1
          fi
          rm -rf Payload NetScan-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y NetScan-unsigned.ipa Payload >/dev/null
          rm -rf Payload
          ls -lh NetScan-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-unsigned-ipa
          path: NetScan-unsigned.ipa
          if-no-files-found: error

      - name: Attach .ipa to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" NetScan-unsigned.ipa --clobber
