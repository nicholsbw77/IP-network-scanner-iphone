# Backup project spec for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The committed NetScan.xcodeproj already works in Xcode; if it ever gets out
# of sync you can regenerate it with:  xcodegen generate
name: NetScan
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  NetScan:
    type: application
    platform: iOS
    sources:
      - NetScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.NetScan
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "NetScan scans your local network to list devices and their open ports."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
